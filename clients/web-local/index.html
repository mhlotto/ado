<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ado local web client</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>ado</h1>
        <p>local web client</p>
      </div>
      <div id="connectionStatus" class="status-pill status-idle">Idle</div>
    </header>

    <main>
      <section class="settings-panel" aria-label="Settings">
        <label for="serverUrl">API server URL</label>
        <div class="settings-row">
          <input id="serverUrl" type="text" autocomplete="off" spellcheck="false">
          <button id="saveServerUrl" type="button">Save</button>
          <button id="testConnection" type="button">Test Connection</button>
          <button id="refreshProjects" type="button">Refresh Projects</button>
        </div>
      </section>

      <section id="messageArea" class="message-area" aria-live="polite"></section>

      <section class="workspace" aria-label="Task workspace">
        <section class="panel" aria-labelledby="projectsTitle">
          <div class="panel-header">
            <h2 id="projectsTitle">Projects</h2>
            <button id="showProjectForm" type="button">Add Project</button>
          </div>
          <form id="projectForm" class="inline-form hidden">
            <label>
              Name
              <input id="projectName" type="text" autocomplete="off" required>
            </label>
            <label>
              Description
              <input id="projectDescription" type="text" autocomplete="off">
            </label>
            <label>
              Tags
              <input id="projectTags" type="text" autocomplete="off" placeholder="home, chores">
            </label>
            <div class="form-actions">
              <button class="primary" type="submit">Create</button>
              <button id="cancelProjectForm" type="button">Cancel</button>
            </div>
          </form>
          <div id="projectList" class="list"></div>
        </section>

        <section class="panel" aria-labelledby="tasksTitle">
          <div class="panel-header">
            <h2 id="tasksTitle">Tasks</h2>
            <button id="showTaskForm" type="button">Add Task</button>
          </div>
          <form id="taskForm" class="inline-form hidden">
            <div class="mode-switch" role="group" aria-label="Task create mode">
              <button id="taskModeSingle" type="button">Single</button>
              <button id="taskModeBulk" type="button">Bulk</button>
            </div>
            <div id="taskSingleFields" class="form-section">
              <label>
                Name
                <input id="taskName" type="text" autocomplete="off">
              </label>
              <label>
                Description
                <input id="taskDescription" type="text" autocomplete="off">
              </label>
            </div>
            <div id="taskBulkFields" class="form-section hidden">
              <label>
                Bulk paste
                <textarea id="taskBulk" rows="7" spellcheck="true"></textarea>
              </label>
            </div>
            <div class="form-actions">
              <button class="primary" type="submit">Create</button>
              <button id="cancelTaskForm" type="button">Cancel</button>
            </div>
          </form>
          <div id="projectActions" class="action-row"></div>
          <div id="taskList" class="list"></div>
        </section>

        <section class="panel" aria-labelledby="taskDetailTitle">
          <div class="panel-header">
            <h2 id="taskDetailTitle">Task detail</h2>
            <button id="showSubtaskForm" type="button">Add SubTask</button>
          </div>
          <form id="subtaskForm" class="inline-form hidden">
            <div class="mode-switch" role="group" aria-label="SubTask create mode">
              <button id="subtaskModeSingle" type="button">Single</button>
              <button id="subtaskModeBulk" type="button">Bulk</button>
            </div>
            <div id="subtaskSingleFields" class="form-section">
              <label>
                Name
                <input id="subtaskName" type="text" autocomplete="off">
              </label>
              <label>
                Description
                <input id="subtaskDescription" type="text" autocomplete="off">
              </label>
            </div>
            <div id="subtaskBulkFields" class="form-section hidden">
              <label>
                Bulk paste
                <textarea id="subtaskBulk" rows="7" spellcheck="true"></textarea>
              </label>
            </div>
            <div class="form-actions">
              <button class="primary" type="submit">Create</button>
              <button id="cancelSubtaskForm" type="button">Cancel</button>
            </div>
          </form>
          <div id="taskDetail" class="detail"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
